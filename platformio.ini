[platformio]
src_dir = examples
default_envs = 01_hello_world

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = pico
framework = arduino
board_build.core = earlephilhower
platform_packages =
  framework-arduinopico @ https://github.com/earlephilhower/arduino-pico/releases/download/6.4.0/rp2040-6.4.0.zip
monitor_speed = 115200
build_flags = -Wl,-u,_scanf_float

[env:01_hello_world]
build_src_filter = -<*> +<01_hello_world/main.cpp>

[display]
lib_deps = adafruit/Adafruit ST7735 and ST7789 Library @ 1.11.0

[env:02_screen]
build_src_filter = -<*> +<02_screen/main.cpp>
lib_deps = ${display.lib_deps}

[env:03_camera]
build_src_filter = -<*> +<03_camera/main.cpp>
lib_deps = ${display.lib_deps}

[env:04_thermal_mlx90640]
build_src_filter = -<*> +<04_thermal_mlx90640/main.cpp>
lib_deps = ${display.lib_deps}

[env:05_fusion_mlx90640]
build_src_filter = -<*> +<05_fusion_mlx90640/main.cpp>
lib_deps = ${display.lib_deps}

[env:06_multicore]
build_src_filter = -<*> +<06_multicore/main.cpp>
lib_deps = ${display.lib_deps}

[env:07_thermal_heimann]
build_src_filter = -<*> +<07_thermal_heimann/main.cpp>
lib_deps = ${display.lib_deps}

[env:08_fusion_heimann]
build_src_filter = -<*> +<08_fusion_heimann/main.cpp>
lib_deps = ${display.lib_deps}

[env:09_touch_screen]
build_src_filter = -<*> +<09_touch_screen/main.cpp>
lib_deps = ${display.lib_deps}
